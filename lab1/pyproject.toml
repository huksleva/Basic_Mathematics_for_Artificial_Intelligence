[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lr-math-matrix-calculus"
version = "1.0.0"
description = "Лабораторная работа по математическому анализу и матричному исчислению"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "jupyter>=1.0",
]

[tool.setuptools]
py-modules = []
