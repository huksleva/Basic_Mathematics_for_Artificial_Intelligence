[project]
name = "autograd-lab"
version = "1.0.0"
description = "Лабораторная работа: скалярное автоматическое дифференцирование и обучение одного нейрона"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Тоц Леонид Александрович" },
]
dependencies = []

[project.optional-dependencies]
dev = [
    "jupyter>=1.0",
    "nbclient>=0.9",
    "pytest>=7.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["autograd_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
